<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/syles.css">
  <title>Agência MVP | Home</title>
</head>

<body>
  <header id="header">
    <nav id="navbar">
      <div>
        <h1>Agência <span class="bold">MVP</span></h1>
      </div>
      <ul>
        <li>Inicio</li>
        <li>Sobre nós</li>
        <li>Nossos serviços</li>
        <li>Avaliações</li>
      </ul>
      <button class="btn btn-primary">Entre em contato</button>
    </nav>
  </header>
  <main id="main">
    <section id="home">
      <div class="opacity"></div>
      <h1 class="title">Descubra o mundo do seu jeito</h1>
      <h3 class="subtitle">Viaje com conforto, segurança e experiências únicas</h3>
      <button class="btn btn-primary">Explorar pacotess</button>
    </section>
    <section id="popular-destination">
      <h1 class="title">Destinos populares</h1>

      <section class="cards">
          <article id="united-states" class="card">
            <img src="./img/popular-destination-1.webp" alt="Destino popular" class="img">
            <p>Estados Unidos</p>
            <button class="btn btn-primary">Ver mais</button>
          </article>
           <article id="united-states" class="card">
            <img src="./img/popular-destination-2.webp" alt="Destino popular" class="img">
            <p>Australia</p>
            <button class="btn btn-primary">Ver mais</button>
          </article>
           <article id="united-states" class="card">
            <img src="./img/popular-destination-3.webp" alt="Destino popular" class="img">
            <p>Polonia</p>
            <button class="btn btn-primary">Ver mais</button>
          </article>
           <article id="united-states" class="card">
            <img src="./img/popular-destination-4.webp" alt="Destino popular" class="img">
            <p>Canadá</p>
            <button class="btn btn-primary">Ver mais</button>
          </article>
      </section>


    </section>
  </main>
  <footer id="footer">

  </footer>
  <script src="./js/script.js"></script>
</body>

</html>
